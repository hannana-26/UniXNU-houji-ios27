soc = "SM8650"
os_profile = "ios-27.0.1-24A446"
summary = "Xiaomi 14 23127PN0CC (houji)。iOS 27.0.1 (24A446, arm64e) 移植,APFS+SHNGROOT 官方路线(与 sheng 同)。r46 的 APFS gate 错绑 panic 已修复并实机验证(c1d3026);r50 的信任包(f93a554)使 launchd exec 成功、dyld 映射 ~930 MB 后死于用户态 SIGSEGV(Initproc failed to start -- exit reason namespace 2 subcode 0xb),已闯入 Stage 7。UEFI sheng-log 读取器 v4.1/v4.2 实机验证(清屏+分页);**r17 实证窗口头=168B sheng v5 流式环(CI 用 sheng kit 的 BootLog,本地 v4 副本未编入),r15/r16/r17 内核均 ~38-48s 静默停止无 panic 屏**;v4.3(按 msg_head 游标读真尾部)已构建待试机(工程记录在仓库外 D:/yizhishouji/交接文档_最新.md 与 进度记录_2026-11-13.md)。"

