schema_version = 2

[board]
name = "houji"
soc = "SM8650"
soc_source = "sm8550"
description = "Xiaomi 14 23127PN0CC (houji)"
# The device package (package/) is installed as kits/sheng, the name build-sheng-source-storage.py and build-arm-driver.py
# search (as aston and shennong do). Board code keeps the sheng-* boot argument names.
kit = "sheng"
os_profile = "ios-27.0.1-24A446"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengUfs", "RamBlock"]

# The iOS root image (SHNGROOT manifest, OS and SystemOS windows, OS.vroot/SystemOS.vroot tables) is flashed over the whole
# Android "userdata" partition (LUN 0, 4096-byte sectors). ShengUfs matches that GPT name (drivers/ShengUfs/RootLayout.h) and
# keeps the log (sheng-log=1) and later the Data store at the END of the partition. Android data on userdata is lost.
# REQUIRED_: first_lba/last_lba are placeholders. Read them from this phone's LUN 0 GPT before building userdata.
[userdata]
partition = "userdata"
first_lba = 0
last_lba = 0
lba_bytes = 4096
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS" }]

[kernel]
defconfig = "houji_ios27_defconfig"
archives = [
  # Before any storage step: component:ShengUfs runs build-sheng-source-storage.py without --policy-dir.
  "stage-aston-root-policies.py scripts/policies/ios-27.0.1-24A446",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  "component:RamBlock",
  "build-fileset-release-reference.py --tree . --lto",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series", "device:patches/xnu-12377/series"]

[device_tree]
source = "device:dts/houji.dts"
include_dirs = ["soc:dts"]

[package]
unixnu = "../UniXNU-official"

[package.defconfig]
"ios-27.0.1-24A446" = "houji_ios27_defconfig"

[adt.product]
[adt.product.string]
model = "xiaomi,houji"
[adt.product.u32]
thin-bezel = 1
[adt.defaults]
[adt.defaults.u32]
sleep-disabled = 1
vmm-present = 1
"kern.maxvnodes" = 33792

[adt.chosen.u32]
# SM8650 has no CTRR (vermeer/aston/sheng): without it sdt_init asserts machine_routines.c:3379.
kernel-ctrr-to-be-enabled = 0

# Stage-0 payload (RAM only, no UFS write). Values marked "unverified" come from peridot/lonzzi and are checked at the
# DarwinBoot / kernel-entry stages of the bring-up order.
[payload]
volume = "HOUJIPAY"
size_mib = 96
loader = "firmware"
# Signed 544-byte VerifiedRoot headers of the iPhone17,2 24A446 OS/SystemOS windows (aston's owner-signed policies, same images).
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
title = "houji iOS 27.0.1: UniXNU"
# One contiguous 2 GiB window at 0x8c0000000 (lonzzi houji UEFI HighRAM, iOS16 flow reached XNU there; author claim). Must equal the DTS memory node.
dram_size = "0x80000000"
# r12 (2026-11-14): green bar after hand-off, no kernel output. The panic screen does not fit this kernel's padding
# (0xa37 bytes at ...815c0, padding ends ...81ff0, 7 bytes short); r13 adds only the entry bars + 6 s reset locally
# (scripts/uefi/mk13.sh).
panic_screen = false
tools = true
trust_cache_sha256 = []
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "cpus=1", "armcpu-diagnostics=1",
  # Storage stage: source UFS root on userdata, UFS diagnostics, boot log in the last 32 MiB of userdata.
  # logfs record (2026-11-17): writes gated on the prepared XNULOG.BIN allocation (HoujiLogFsCore.h);
  # until logfs is backed up and rebuilt on the phone the open refuses and nothing is written there.
  "native-source-storage=1", "native-ufs-root=1", "native-ufs-diagnostics=1", "sheng-log=1",
  "houji-logfs=1", "houji-logfs-recovery=1",
  # P10 plan A (2026-11-23): the persistent Data store window (NativeUfs.cpp:1273; =2 opens writes,
  # =1 is a read-only window proof that an isBig disk must not use). data-reset=1 travels only on the
  # one-time provisioning boot (mk60b), never in board.toml.
  "sheng-data-persist=2",
  # r61 (2026-11-23, as sheng :61/:185/:243 and aston :137): disable watchdogd (no hardware watchdog
  # backend on this board) and the bring-up lite list (identityservicesd/locationd/CommCenter cycles,
  # obliteration, fairplayd, coreduetd, ...); BootWatchdogPolicy.c writes them into launchd's
  # disabled.plist on the writable Data volume. Also the top candidate behind boot1's restart request.
  "sheng-disable-watchdogd=1", "sheng-lite=1"]

[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "ios27"
build = "24A446"
# r49/r48 established the launchd SIGKILL (OS_REASON_CODESIGNING code 0x8 at exec) is kernel-side
# code-signing validation: without a trust bundle no Apple platform binary validates, and the
# diagnostic amfi_get_out_of_my_way=1 does not bypass the kernel check. The trust bundle comes from
# these IPSW members, as on aston (board.toml [payload.runtime]); the Data seed itself is provided
# by scripts/make-houji-data-seed.py through the workflow pre_build (--data-ramdisk).
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
# The trust bundle holds the original caches only; the houji GPU addon is not configured yet.
gpu_addon = false

[payload.adt]
# T8140 (iPhone17,2 profile chip id 33088). Unverified for this board.
chip_id = "0x8140"
# r19: 8 GiB overflowed XNU's 16-page bootstrap tables (start_first_cpu self-loop at +0x230); keep = dram_size.
owned_memory_size = "0x80000000"
# r46: packed delivery (as sheng/aston/cupid/peridot): DarwinBoot keeps the
# packed seed (small) instead of expanding it -- the unpacked RAMDisk path
# needed the 8 GiB seed expanded inside the 2 GiB darwinboot window and failed
# with EFI_BAD_BUFFER_SIZE; the kernel's RamBlock unpacks packed seeds natively.
packed_data_ramdisk = true
# P10 fix (2026-11-23, plan A as sheng/aston): the 8 GiB packed seed alone is
# read-only by design (RamBlock isBig serves writes only through the persistent
# store, NativeRamBlock.cpp:74-75). persistent_data drops the ephemeral-storage
# ADT property; the kernel argument sheng-data-persist=2 (NativeUfs.cpp:1273,
# the same name aston passes) opens the store window at the end of userdata
# (persist::windowBlocks = 1+bitmap+pages ~= 8.0005 GiB, default 1 GiB
# sheng-log-reserve keeps clear of the log). First store open needs data-reset=1
# once (mk60b provisioning image); later boots resume without it.
persistent_data = true

[bootimg.image]
base = 0x80000000
kernel_offset = 0x8000
ramdisk_offset = 0x28000000
tags_offset = 0x100
pagesize = 4096
header_version = 0
os_version = "16.0.0"
os_patch_level = "2026-08"

[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = "0xA8000000" },
  { name = "linux,initrd-end", type = "x", value = "0xAE000000" },
]
